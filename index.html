<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Impasto Wallpapers — Минималистичные обои</title>
  <style>
    /* === СБРОС СТИЛЕЙ И БАЗОВЫЕ НАСТРОЙКИ === */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d0d0d;
      color: #f5f5f7;
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* === ШАПКА / HERO === */
    header {
      padding: 100px 20px 60px;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 1.15rem;
      color: #86868b;
      font-weight: 400;
    }

    /* === ГАЛЕРЕЯ (СЕТКА) === */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 100px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 32px;
    }

    /* === КАРТОЧКА ТОВАРА === */
    .card {
      background-color: #161617;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                  box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .card-img-wrapper {
      width: 100%;
      padding-top: 133%; /* Пропорция 3:4 для мобильных обоев */
      position: relative;
      overflow: hidden;
      background-color: #1c1c1e;
    }

    .card-img-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover .card-img-wrapper img {
      transform: scale(1.08);
    }

    .card-info {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 500;
      color: #f5f5f7;
    }

    .card-price {
      font-size: 0.95rem;
      color: #86868b;
      font-weight: 400;
    }

    /* === МОДАЛЬНОЕ ОКНО (PREVIEW) === */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #1c1c1e;
      border-radius: 28px;
      max-width: 440px;
      width: 100%;
      padding: 30px;
      text-align: center;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: #86868b;
      font-size: 1.8rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: #fff;
    }

    /* Макет телефона внутри модального окна */
    .phone-mockup {
      width: 200px;
      height: 400px;
      margin: 20px auto;
      border-radius: 36px;
      border: 4px solid #333;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .phone-mockup img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .buy-btn {
      display: inline-block;
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      background-color: #ffffff;
      color: #000000;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
      text-decoration: none;
    }

    .buy-btn:hover {
      background-color: #e5e5e5;
      transform: scale(1.02);
    }

    .buy-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- ШАПКА -->
  <header>
    <h1>Impasto Wallpapers</h1>
    <p class="subtitle">Тактильная живопись и фактура мазков для твоего смартфона</p>
  </header>

  <!-- ГАЛЕРЕЯ ОБОЕВ -->
  <main>
    <div class="gallery">

      <!-- Карточка 1 -->
      <div class="card" onclick="openModal('Абстрактный Этюд #1', '500 ₸', 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?q=80&w=800')">
        <div class="card-img-wrapper">
          <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?q=80&w=800" alt="Impasto Artwork 1" loading="lazy">
        </div>
        <div class="card-info">
          <span class="card-title">Этюд #1</span>
          <span class="card-price">500 ₸</span>
        </div>
      </div>

      <!-- Карточка 2 -->
      <div class="card" onclick="openModal('Текстура #2', '500 ₸', 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?q=80&w=800')">
        <div class="card-img-wrapper">
          <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?q=80&w=800" alt="Impasto Artwork 2" loading="lazy">
        </div>
        <div class="card-info">
          <span class="card-title">Текстура #2</span>
          <span class="card-price">500 ₸</span>
        </div>
      </div>

      <!-- Карточка 3 -->
      <div class="card" onclick="openModal('Масло и Волна #3', '500 ₸', 'https://images.unsplash.com/photo-1549887534-1541e9326642?q=80&w=800')">
        <div class="card-img-wrapper">
          <img src="https://images.unsplash.com/photo-1549887534-1541e9326642?q=80&w=800" alt="Impasto Artwork 3" loading="lazy">
        </div>
        <div class="card-info">
          <span class="card-title">Масло #3</span>
          <span class="card-price">500 ₸</span>
        </div>
      </div>

    </div>
  </main>

  <!-- МОДАЛЬНОЕ ОКНО ПРЕДПРОСМОТРА -->
  <div class="modal-overlay" id="modal" onclick="closeModalOnOuterClick(event)">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2 id="modal-title" style="font-weight: 400; font-size: 1.4rem;">Название</h2>
      
      <!-- Мокап экрана -->
      <div class="phone-mockup">
        <img id="modal-img" src="" alt="Preview">
      </div>

      <p id="modal-price" style="color: #86868b; margin-bottom: 10px;">500 ₸</p>
      
      <!-- Ссылка на покупку / оплату -->
      <a href="https://t.me/your_username" target="_blank" class="buy-btn" id="buy-button">Купить HD Обои</a>
    </div>
  </div>

  <!-- СКРИПТ ЛОГИКИ И АНИМАЦИИ -->
  <script>
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalPrice = document.getElementById('modal-price');
    const modalImg = document.getElementById('modal-img');

    function openModal(title, price, imgSrc) {
      modalTitle.innerText = title;
      modalPrice.innerText = price;
      modalImg.src = imgSrc;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden'; // Запрет скролла фона
    }

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = ''; // Возврат скролла
    }

    function closeModalOnOuterClick(e) {
      if (e.target === modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
